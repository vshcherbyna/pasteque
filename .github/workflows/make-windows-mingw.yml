name: Pasteque Windows MinGW Build with Make

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # Allow manual triggering of the workflow

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # MINGW64 is the x86_64 gcc environment. make comes from the msys package rather than
    # mingw-w64-x86_64-make, which installs it under the name mingw32-make instead.
    - name: Set up MSYS2 MINGW64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          make

    - name: Show what make will be given
      run: |
        g++ --version | head -1
        make --version | head -1

    # The makefile links the mingw runtime statically here, so the engine travels off
    # this runner without dragging its dlls behind it.
    - name: Build with make
      run: make -j EXE=pasteque-ob

    - name: Confirm nothing outside the system is linked in
      run: |
        ldd pasteque-ob.exe | tee links.txt || true
        ! grep -iE 'libstdc\+\+|libgcc|libwinpthread' links.txt

    # The node count is a watermark. The same positions searched to the same depth have to
    # produce the same tree on every compiler and every platform, so a mismatch here is
    # either a search change that bench.nodes should have been updated for in the same
    # commit, or a real portability bug. OpenBench relies on exactly this property.
    - name: Bench the engine
      run: |
        ./pasteque-ob bench | tee bench.txt
        tail -1 bench.txt | grep -Eq '^[0-9]+ nodes [0-9]+ nps$'
        # tr, not cat: a windows runner may check bench.nodes out with a carriage return
        # on the end of it, and the comparison would then fail for no reason at all.
        test "$(tail -1 bench.txt | cut -d' ' -f1)" = "$(tr -dc '0-9' < bench.nodes)"

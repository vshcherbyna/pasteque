name: Pasteque Windows MinGW Build with Make

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2 MINGW64
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          make

    - name: Show what make will be given
      run: |
        g++ --version | head -1
        make --version | head -1

    - name: Build with make
      run: make -j EXE=pasteque-ob

    - name: Confirm nothing outside the system is linked in
      run: |
        ldd pasteque-ob.exe | tee links.txt || true
        ! grep -iE 'libstdc\+\+|libgcc|libwinpthread' links.txt

    - name: Bench the engine
      run: |
        ./pasteque-ob bench | tee bench.txt
        tail -1 bench.txt | grep -Eq '^[0-9]+ nodes [0-9]+ nps$'
        test "$(tail -1 bench.txt | cut -d' ' -f1)" = "$(tr -dc '0-9' < bench.nodes)"

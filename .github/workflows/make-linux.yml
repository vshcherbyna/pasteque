name: Pasteque Linux Build with Make

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install the toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ make

    - name: Show what make will be given
      run: |
        g++ --version | head -1
        make --version | head -1

    - name: Build with make
      run: make -j EXE=pasteque-ob

    - name: Bench the engine
      run: |
        ./pasteque-ob bench | tee bench.txt
        tail -1 bench.txt | grep -Eq '^[0-9]+ nodes [0-9]+ nps$'
        test "$(tail -1 bench.txt | cut -d' ' -f1)" = "$(tr -dc '0-9' < bench.nodes)"

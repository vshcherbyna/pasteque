name: Pasteque Windows Build with CMake

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ windows-latest ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -S . -B local -A x64

    - name: Build the project
      run: cmake --build local --config Release

    - name: Run the unit tests
      run: local\Release\unit.exe
      shell: cmd

    - name: Smoke the engine
      shell: bash
      run: |
        printf 'uci\nisready\nposition startpos moves e2e4 e7e5\ngo depth 6\nquit\n' | ./local/Release/pasteque.exe | tee smoke.txt
        grep -q '^uciok$' smoke.txt
        grep -q '^readyok$' smoke.txt
        grep -q '^bestmove ' smoke.txt

    - name: Bench the engine
      shell: bash
      run: |
        ./local/Release/pasteque.exe bench | tee bench.txt
        tail -1 bench.txt | grep -Eq '^[0-9]+ nodes [0-9]+ nps$'
        test "$(tail -1 bench.txt | cut -d' ' -f1)" = "$(tr -dc '0-9' < bench.nodes)"
